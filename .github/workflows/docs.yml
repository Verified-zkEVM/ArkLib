name: Build and Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
permissions:
  contents: read          # Read access to repository contents
  pages: write            # Write access to GitHub Pages
  id-token: write         # Required to upload the site to GitHub Pages
  issues: write           # Allow the blueprint check to comment
  pull-requests: write    # Allow the blueprint check to comment

# Cancel previous runs if a new commit is pushed to the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and deploy blueprint + documentation
    # doc-gen4 setting preserved from the previous workflow.
    env:
      DISABLE_EQUATIONS: 1
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Build the project
        uses: leanprover/lean-action@v1.5.0
        with:
          build: true
          lint: false
          use-github-cache: true

      # Builds the API docs (doc-gen4, via an isolated docbuild project), the
      # blueprint (leanblueprint pdf + web), checks the blueprint declarations
      # exist in the Lean sources, and deploys everything to GitHub Pages.
      # Deploy/upload steps are gated to `push` events by the action itself, so
      # pull requests get a validation-only build of the blueprint and decls.
      # docgen-action publishes no tags/releases and its README suggests `@main`.
      # A moving branch is neither reproducible nor trackable by Dependabot, so we
      # pin the current `main` commit instead; Dependabot bumps this SHA via PR.
      - name: Build blueprint and documentation
        uses: leanprover-community/docgen-action@10db47458f91456d87804787d3dfcd914b9a19e3 # 2026-06-07
        with:
          blueprint: true
          homepage: home_page
          build-page: false
          references: blueprint/src/references.bib
