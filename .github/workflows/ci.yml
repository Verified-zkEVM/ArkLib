name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject generated KB updates in PRs
        if: >-
          github.event_name == 'pull_request' &&
          (
            github.event.pull_request.user.login != 'github-actions[bot]' ||
            !startsWith(github.head_ref, 'automation/kb-generated-')
          )
        run: |
          changed="$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            -- docs/kb/_generated)"
          if [ -n "$changed" ]; then
            echo "Do not commit docs/kb/_generated files in feature PRs."
            echo "They are refreshed on main by the KB generated-files workflow."
            echo "$changed"
            exit 1
          fi

      - name: Initialize timing paths
        run: |
          echo "BUILD_TIMING_RESULTS=$RUNNER_TEMP/build-timing.jsonl" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_LOG_DIR=$RUNNER_TEMP/build-timing-logs" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_ARTIFACT_DIR=$RUNNER_TEMP/build-timing-artifact" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_ARTIFACT_NAME=arklib-build-timing-data" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_METADATA_PATH=$RUNNER_TEMP/build-timing-artifact/metadata.json" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_REPORT=$RUNNER_TEMP/build-timing.md" >> "$GITHUB_ENV"
          echo "SOURCE_TRUST_REPORT=$RUNNER_TEMP/source-trust.json" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_SOURCE_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_SOURCE_BRANCH=${{ github.head_ref || github.ref_name }}" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_TEST_NAME=Validation wrapper" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_TEST_COMMAND=./scripts/validate.sh" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_NATIVE_NAME=Native build" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_NATIVE_COMMAND=lake build toyproblem-runtime hachi-runtime lint-style" >> "$GITHUB_ENV"
          {
            echo "BUILD_TIMING_SOURCE_SUBJECT<<EOF"
            git log -1 --format=%s
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Restore Lean cache
        uses: actions/cache/restore@v6
        id: lake-cache
        with:
          path: ./.lake
          key: ${{ runner.os }}-lean-ci-${{ hashFiles('lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lean-ci-
            ${{ runner.os }}-lean-docs-${{ hashFiles('lake-manifest.json') }}
            ${{ runner.os }}-lean-docs-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Complements the kernel-level sweep with a lexical inventory of constructs that
      # attach to no environment declaration (for example `example`s and sorry-backed
      # defaults/autoparams), including tracked files outside the import roots. This inventory
      # is report-only; the enforcing kernel sweep below owns all taint verdicts.
      - name: Audit source-level trust blind spots
        env:
          SOURCE_TRUST_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          python3 scripts/test-source-trust-audit.py
          args=(--json "$SOURCE_TRUST_REPORT")
          if [ -n "$SOURCE_TRUST_BASE_REF" ] &&
             [ "$SOURCE_TRUST_BASE_REF" != "0000000000000000000000000000000000000000" ]; then
            args+=(--base-ref "$SOURCE_TRUST_BASE_REF")
          fi
          python3 scripts/source-trust-audit.py "${args[@]}" | tee "$RUNNER_TEMP/source-trust.md"
          cat "$RUNNER_TEMP/source-trust.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Lean environment
        uses: leanprover/lean-action@v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Fetch dependency cache
        run: lake exe cache get

      - name: Time clean build
        run: |
          bash scripts/build_timing_report.sh run clean_build "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c 'rm -rf .lake/build && lake build'

      - name: Time warm rebuild
        run: |
          bash scripts/build_timing_report.sh run warm_rebuild "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c 'lake build'

      # VCVio's FFI C sources live in git submodules that Lake does not fetch, and every
      # root-package executable links them. Without them VCVio falls back to empty stub archives,
      # so this has to run before anything native is built or timed: otherwise the native build
      # links stubs, the later steps relink against the real backends, and the two measure
      # different things.
      - name: Fetch VCVio FFI submodules
        run: |
          if [ -e .lake/packages/VCVio/.git ]; then
            git -C .lake/packages/VCVio submodule update --init --recursive
          fi

      # `validate.sh` runs `lake exe toyproblem-runtime` and `lake exe hachi-runtime`, which link
      # the native `.c.o` chain for the whole dependency graph. That work is billed here rather
      # than to the validation wrapper: the `.lake` cache key is `hashFiles('lake-manifest.json')`,
      # so a dependency bump misses the cache and the compile costs ~5 minutes, which used to read
      # as a wrapper regression. Every compiled executable `validate.sh` runs belongs in this
      # command; otherwise its link cost silently lands in the `test_path` row instead.
      - name: Time native build
        run: |
          bash scripts/build_timing_report.sh run native_build "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c 'lake build toyproblem-runtime hachi-runtime lint-style'

      # The fixture matrix is enforcing: it certifies the sweep tool itself (gate
      # directions, native-trust floor, exit-code contract), independent of any
      # taint verdict about the library.
      - name: Test the axiom sweep tool
        run: ./scripts/test-axiomsweep.sh

      # Enforcing regression gate. Intentional sorry debt remains possible by refreshing
      # and reviewing scripts/axiom_baseline.json; native/compiler trust cannot be baselined.
      - name: Check the library axiom baseline
        run: lake exe axiomsweep --check

      - name: Time validation wrapper
        run: |
          bash scripts/build_timing_report.sh run test_path "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c './scripts/validate.sh'

      - name: Save Lean cache
        if: success() && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ./.lake
          key: ${{ runner.os }}-lean-ci-${{ hashFiles('lake-manifest.json') }}

      # Reuse the project build above for blueprint/checkdecls validation and, on trusted
      # main pushes, API-doc generation. The action cannot publish from this read-only job.
      - name: Build blueprint and documentation
        uses: leanprover-community/docgen-action@10db47458f91456d87804787d3dfcd914b9a19e3 # 2026-06-07
        env:
          DISABLE_EQUATIONS: 1
        with:
          blueprint: true
          homepage: home_page
          build-page: false
          deploy: false
          references: blueprint/src/references.bib

      # The pinned docgen action writes blueprint/API output under `homepage` and, with
      # build-page false, its own deploy path is exactly `${homepage}/`. Transfer that directory
      # instead of recompiling the project in the privileged publisher. This artifact contains
      # no credentials and is only deployed after a main push.
      - name: Upload Pages site for publication
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: arklib-pages-site
          path: home_page
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Prepare timing artifact
        if: always()
        env:
          BUILD_TIMING_RUN_ID: ${{ github.run_id }}
          BUILD_TIMING_RUN_ATTEMPT: ${{ github.run_attempt }}
          BUILD_TIMING_EVENT: ${{ github.event_name }}
          BUILD_TIMING_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_TIMING_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          BUILD_TIMING_REF: ${{ github.head_ref || github.ref_name }}
          BUILD_TIMING_CACHE_EXACT_HIT: ${{ steps.lake-cache.outputs.cache-hit }}
          BUILD_TIMING_CACHE_PRIMARY_KEY: ${{ steps.lake-cache.outputs.cache-primary-key }}
          BUILD_TIMING_CACHE_MATCHED_KEY: ${{ steps.lake-cache.outputs.cache-matched-key }}
        run: |
          rm -rf "$BUILD_TIMING_ARTIFACT_DIR"
          mkdir -p "$BUILD_TIMING_ARTIFACT_DIR"
          python3 scripts/build_timing_metadata.py "$BUILD_TIMING_METADATA_PATH"
          if [ -f "$BUILD_TIMING_RESULTS" ]; then
            cp "$BUILD_TIMING_RESULTS" "$BUILD_TIMING_ARTIFACT_DIR/results.jsonl"
          fi
          if [ -f "$BUILD_TIMING_LOG_DIR/clean_build.log" ]; then
            cp "$BUILD_TIMING_LOG_DIR/clean_build.log" "$BUILD_TIMING_ARTIFACT_DIR/clean_build.log"
          fi
          if [ -f "$SOURCE_TRUST_REPORT" ]; then
            cp "$SOURCE_TRUST_REPORT" "$BUILD_TIMING_ARTIFACT_DIR/source-trust.json"
          fi

      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_TIMING_ARTIFACT_NAME }}
          path: ${{ env.BUILD_TIMING_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: Render build timing report
        if: always()
        run: |
          bash scripts/build_timing_report.sh render "$BUILD_TIMING_RESULTS" > "$BUILD_TIMING_REPORT"
          cat "$BUILD_TIMING_REPORT" >> "$GITHUB_STEP_SUMMARY"

  # This job is never instantiated for a pull_request event, so PR-head code receives
  # neither the Pages token nor an OIDC token. It runs only after trusted main has passed.
  publish-docs:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download generated Pages site
        uses: actions/download-artifact@v8
        with:
          name: arklib-pages-site
          path: ${{ runner.temp }}/arklib-pages-site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/arklib-pages-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
