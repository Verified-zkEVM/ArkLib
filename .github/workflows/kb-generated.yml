name: Refresh KB Generated Files

on:
  schedule:
    # 01:17 America/Phoenix. A non-hour boundary avoids the busiest cron window.
    - cron: "17 8 * * *"
  push:
    branches: ["main"]
    paths:
      - "blueprint/src/references.bib"
      - "docs/kb/papers/**"
      - "docs/kb/sources/**"
      - "scripts/kb/**"
      - ".github/workflows/kb-generated.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: kb-generated-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate KB files
        run: python3 ./scripts/kb/regenerate.py

      - name: Check generated files
        run: python3 ./scripts/kb/check_generated.py

      - name: Lint generated KB state
        run: python3 ./scripts/kb/lint.py --strict-cited-pages --use-generated-indexes

      - name: Open generated update PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/kb-generated
        run: |
          if git diff --quiet -- docs/kb/_generated docs/kb/papers docs/kb/sources; then
            echo "No KB generated updates to propose."
            exit 0
          fi

          base_sha="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH_NAME"
          git add -A docs/kb/_generated docs/kb/papers docs/kb/sources
          git commit -m "chore(kb): refresh generated files"
          invalid_paths="$(git diff --name-only "$base_sha" HEAD | grep -Ev '^(docs/kb/_generated/|docs/kb/papers/|docs/kb/sources/)' || true)"
          if [ -n "$invalid_paths" ]; then
            echo "Refusing to auto-merge unexpected generated-files PR paths:"
            echo "$invalid_paths"
            exit 1
          fi

          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$base_sha" ]; then
            echo "main advanced from $base_sha to $current_main during regeneration; refusing to publish a stale snapshot."
            exit 1
          fi
          git push --force-with-lease origin "HEAD:$BRANCH_NAME"

          body="$RUNNER_TEMP/kb-generated-pr.md"
          {
            echo "Regenerates ArkLib knowledge-base derived files from the latest \`main\`."
            echo
            echo "This is the single rolling KB refresh PR. The nightly workflow updates this branch"
            echo "in place instead of opening one PR per Lean merge."
            echo
            echo "Generated by \`.github/workflows/kb-generated.yml\` for source commit \`${base_sha}\`."
            echo
            echo "Do not use GitHub's **Update branch** action on this PR: a plain base merge does not"
            echo "rerun generation. If \`main\` advances, dispatch the KB workflow or wait for its next run."
            echo
            echo "This PR may update:"
            echo
            echo "- \`docs/kb/_generated/**\`"
            echo "- stub-only cited paper pages under \`docs/kb/papers/\`"
            echo "- stub-only source metadata under \`docs/kb/sources/\`"
          } > "$body"

          existing_pr="$(gh pr list \
            --base main \
            --head "$BRANCH_NAME" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" \
              --title "chore(kb): refresh generated files" \
              --body-file "$body"
            pr_url="$(gh pr view "$existing_pr" --json url --jq .url)"
          else
            pr_url="$(gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "chore(kb): refresh generated files" \
              --body-file "$body")"
          fi

          # Pull-request workflows created by github-actions[bot] can wait for
          # contributor approval. Explicit workflow_dispatch runs are trusted
          # repository events and attach the required checks to this head SHA.
          gh workflow run ci.yml --ref "$BRANCH_NAME"
          gh workflow run check-imports.yml --ref "$BRANCH_NAME"
          gh workflow run docs-integrity.yml --ref "$BRANCH_NAME"
          gh workflow run lint-whitespaces.yml --ref "$BRANCH_NAME"

          gh pr merge "$pr_url" --auto --squash --delete-branch
